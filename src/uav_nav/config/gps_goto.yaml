# Parameters for gps_goto: one waypoint on the NTUT East Dorm field (WP1 of gps_goto_ntut.yaml).
# SITL home: 25.042486, 121.537627 (set once by hand, docs/MANUAL_RUN.md §2).
gps_goto:
  ros__parameters:
    # [lat, lon, alt_rel (m above the takeoff point)] concatenated
    waypoints: [25.042833, 121.537612, 10.0]   # ~39 m North of home
    takeoff_alt: 5.0
    acceptance_radius: 1.0
    acceptance_alt: 1.0
    hold_time: 5.0
    wp_timeout: 90.0
    max_eph: 3.0
    max_drift: 3.0          # m, excessive horizontal drift during takeoff -> land
    land_at_end: true

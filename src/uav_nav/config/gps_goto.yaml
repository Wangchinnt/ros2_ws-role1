# Parameters for gps_goto. SITL home: 47.397742, 8.545594 (SIM_GZ_HOME_LAT/LON).
gps_goto:
  ros__parameters:
    # [lat, lon, alt_rel (m above the takeoff point)] concatenated
    waypoints: [47.398200, 8.546200, 10.0]
    takeoff_alt: 5.0
    acceptance_radius: 1.0
    acceptance_alt: 1.0
    hold_time: 5.0
    wp_timeout: 90.0
    max_eph: 3.0
    max_drift: 3.0          # m, excessive horizontal drift during takeoff -> land
    land_at_end: true

# mavlink-router for SITL: plays the role of voxl-mavlink-server on VOXL 2.
#
#   PX4 SITL (onboard link: listens on 14580, sends to 14540)
#        │
#        ▼  UDP 14540
#   mavlink-routerd ──► UDP 14640 ──► MAVROS (gps_goto)
#        └────────────► UDP 14551 ──► 2nd GCS (e.g. QGC with an extra UDP 14551 link)
#
# Usage: ros2 launch uav_nav gps_goto.launch.py router:=true

[General]
TcpServerPort = 0
ReportStats = true

# PX4 side: router listens on 14540 (the port the PX4 SITL "onboard" MAVLink instance sends to)
[UdpEndpoint px4]
Mode = Server
Address = 127.0.0.1
Port = 14540

# Onboard computer side: MAVROS listens on 14640
[UdpEndpoint mavros]
Mode = Normal
Address = 127.0.0.1
Port = 14640

# Ground side: a second GCS (QGC already receives directly from PX4 on 14550 by default)
[UdpEndpoint gcs]
Mode = Normal
Address = 127.0.0.1
Port = 14551
